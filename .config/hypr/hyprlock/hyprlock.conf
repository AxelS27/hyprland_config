source = ~/.config/lthemes/current-theme.conf

$CITY = Bojonegoro
$COUNTRY = ID

background {
    monitor = 
    path = screenshot
    blur_passes = 3
    contrast = .8916
    brightness = .8172
    vibrancy = .1696
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

input-field {
    size = 230, 45

    outline_thickness = 1
    dots_size = .2
    dots_spacing = .2
    dots_center = true
    outer_color = $fg
    inner_color = $lightgray
    font_color = $bgalt
    fade_on_empty = false
    font_family = SF Pro Text Semibold
    placeholder_text = Enter Password
    hide_input = false
    position = 0, -300
    halign = center
    valign = center
}

# Time
label {
    monitor = 
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $white
    font_size = 85
    font_family = SF Pro Display Bold
    position = 0, 310
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $fg
    font_size = 30
    font_family = SF Pro Display Semibold
    position = 0, 400
    halign = center
    valign = center
}
# Profile-Photo
image {
    monitor = 
    path = /home/axel/.config/hypr/hyprlock/profile-picture.png
    border_color = $fg
    border_size = 1
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 0
    halign = center
    valign = center
}

# USER
label {
    monitor = 
    text = $USER
    color = $fg
    font_size = 20
    font_family = SF Pro Text Semibold
    position = 0, -120
    halign = center
    valign = center
}

# CURRENT SONG (Spotify)
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/spotify-playing.sh)"
    color = $green
    font_size = 18
    font_family = SF Pro Display Semibold
    position = 100, 0
    halign = left
    valign = center
}

# WEATHERCAST & LOCATION
label {
    monitor = 
    text = cmd[update:1000] echo "$(bash ~/.config/hypr/hyprlock/scripts/weather.sh)"
    shadow_passes = 1
    shadow_boost = .5
    color = $white
    font_size = 18
    font_family = SF Pro Display Semibold

    position = 95.5, -40
    halign = left
    valign = center
}
